# Generates WhereToKite.xcodeproj:  cd App && xcodegen
name: WhereToKite
options:
  bundleIdPrefix: com.benjcvd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  WhereToKite:
    path: ..
targets:
  WhereToKite:
    type: application
    platform: iOS
    sources:
      - path: WhereToKite
      - path: ../Data/spots.json
        buildPhase: resources
    dependencies:
      - package: WhereToKite
        product: KiteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjcvd.wheretokite
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Text is in Localizable.xcstrings (English source, Spanish), Info.plist text in InfoPlist.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WhereToKite
        # HTTPS only (exempt): skips the export-compliance question on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to find kite spots within driving distance."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  WhereToKiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhereToKiteUITests
    dependencies:
      - target: WhereToKite
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhereToKite
  WhereToKiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhereToKiteTests
    dependencies:
      - target: WhereToKite
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhereToKite.app/WhereToKite"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WhereToKite:
    build:
      targets:
        WhereToKite: all
    test:
      targets:
        - WhereToKiteTests
        - WhereToKiteUITests
