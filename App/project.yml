# Generates WhereToKite.xcodeproj:  cd App && xcodegen
name: WhereToKite
options:
  bundleIdPrefix: com.benjcvd
  deploymentTarget:
    iOS: "17.0"
packages:
  WhereToKite:
    path: ..
targets:
  WhereToKite:
    type: application
    platform: iOS
    sources:
      - path: WhereToKite
      - path: ../Data/spots_barcelona.json
        buildPhase: resources
    dependencies:
      - package: WhereToKite
        product: KiteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjcvd.wheretokite
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WhereToKite
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to find kite spots within driving distance."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  WhereToKiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhereToKiteUITests
    dependencies:
      - target: WhereToKite
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhereToKite
schemes:
  WhereToKite:
    build:
      targets:
        WhereToKite: all
    test:
      targets:
        - WhereToKiteUITests
