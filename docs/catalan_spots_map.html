<!doctype html><html><head><meta charset="utf-8"><title>WhereToKite – Catalan spots</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font:14px -apple-system,sans-serif;display:flex;height:100vh}
#list{width:340px;overflow:auto;border-right:1px solid #ddd}#map{flex:1}
.it{padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer}.it:hover{background:#f3f6fa}
.n{font-weight:600}.m{color:#666;font-size:12px}.pro{color:#8a5cf6}.free{color:#0a7d43}

<div id="list"><h1>Catalan spots (32) · as in the next build</h1><div class="m" style="margin:0 12px 8px">Green = free, purple = Pro. Arrow = way the beach faces (the sea side). Click a spot to zoom on satellite.</div></div><div id="map"></div>
<script>
const S=[{"id": "es-empuriabrava-la-rubina", "name": "Empuriabrava – La Rubina", "latitude": 42.25839, "longitude": 3.14905, "seaFacingDeg": 149.8, "distanceToShoreM": 20.4, "notes": "The only kite beach in Castelló d'Empúries: signposted zone at the Santa Margarida end (Aiguamolls natural park, use the marked dune paths); best in easterlies.", "bans": null, "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-sant-pere-pescador", "name": "Sant Pere Pescador", "latitude": 42.18867, "longitude": 3.10803, "seaFacingDeg": 89.4, "distanceToShoreM": 269.5, "notes": "Kite areas of about 200 m each: Cortal de la Vila (schools and free riding) and Cortal de la Devesa (run by the La Ballena Alegre campsite); in summer stay in the marked channels. Tramuntana and summer thermal. Also: Empuriabrava – La Rubina (5 km north, easterlies).", "bans": null, "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-sant-marti-d-empuries", "name": "Sant Martí d'Empúries", "latitude": 42.1343, "longitude": 3.12247, "seaFacingDeg": 69.9, "distanceToShoreM": 58.5, "notes": "Beach in the Gulf of Roses south of Sant Pere Pescador; easterlies; tramuntana side-off.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-l-escala-platja-dels-riells", "name": "L'Escala (Platja dels Riells)", "latitude": 42.11566, "longitude": 3.13984, "seaFacingDeg": 46.4, "distanceToShoreM": 42.4, "notes": "Town beach at the south end of the Gulf of Roses; tramuntana and easterlies. Packed with swimmers in summer.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-l-estartit-gola-del-ter", "name": "L'Estartit – Gola del Ter", "latitude": 42.03697, "longitude": 3.19761, "seaFacingDeg": 97.2, "distanceToShoreM": 150.6, "notes": "Kite zone on La Pletera beach, a beach concession run by the local school; in summer launch there only, other water sports stay beyond the swim buoys. Easterlies and summer thermal; tramuntana side-off.", "bans": null, "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-pals", "name": "Pals", "latitude": 41.99257, "longitude": 3.20175, "seaFacingDeg": 73.7, "distanceToShoreM": 14.1, "notes": "Long open beach south of the Ter mouth; easterlies and summer thermal; tramuntana side-off. Kites restricted 1 Jun–30 Sep (Pals tourist office), no summer kite zone.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-palamos-la-fosca", "name": "Palamós (La Fosca)", "latitude": 41.85691, "longitude": 3.14326, "seaFacingDeg": 118.1, "distanceToShoreM": 24.8, "notes": "Sheltered bay north of Palamós; easterlies and summer thermal. Irregular shoreline near the spot; orientation less certain.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-platja-d-aro", "name": "Platja d'Aro", "latitude": 41.81678, "longitude": 3.07034, "seaFacingDeg": 116.1, "distanceToShoreM": 28.4, "notes": "Town beach; garbí (SW summer thermal) cross-shore. Gregal and levante bring shorebreak and chop, not for beginners. Quieter by the Ridaura mouth; the wind drops south of the harbour wall.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-malgrat-de-mar-la-pomareda", "name": "Malgrat de Mar – La Pomareda", "latitude": 41.64874, "longitude": 2.77214, "seaFacingDeg": 156.2, "distanceToShoreM": 86.0, "notes": "Municipal kite zone looked after by Club Kite Malgrat; SW thermal Mar–Sep.", "bans": null, "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-vilassar-de-mar", "name": "Vilassar de Mar", "latitude": 41.49633, "longitude": 2.38153, "seaFacingDeg": 147.4, "distanceToShoreM": 33.4, "notes": "Maresme beach; levante and summer garbí.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-montgat", "name": "Montgat", "latitude": 41.46631, "longitude": 2.28239, "seaFacingDeg": 146.7, "distanceToShoreM": 2.6, "notes": "Small beach north of Badalona; levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-badalona", "name": "Badalona", "latitude": 41.44184, "longitude": 2.2467, "seaFacingDeg": 118.8, "distanceToShoreM": 45.2, "notes": "City beach north of Barcelona; levante and gregal days.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-barcelona-nova-mar-bella", "name": "Barcelona – Nova Mar Bella", "latitude": 41.40174, "longitude": 2.21511, "seaFacingDeg": 127.7, "distanceToShoreM": 27.6, "notes": "No kite zone: the city bans kiting 1 Jun–30 Sep (Capitania Marítima rule); off-season levante / gregal days only, away from the boat channels.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-barcelona-barceloneta", "name": "Barcelona – Barceloneta", "latitude": 41.37938, "longitude": 2.1934, "seaFacingDeg": 133.2, "distanceToShoreM": 12.6, "notes": "City beach; the city bans kiting 1 Jun–30 Sep. Off-season levante / gregal days only, away from the boat channels.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-castelldefels", "name": "Castelldefels", "latitude": 41.26421, "longitude": 1.97907, "seaFacingDeg": 180.4, "distanceToShoreM": 37.0, "notes": "Town kite zone 1 Jun–mid Sep at Platja de la Pineda, between Carrer 9 and Carrer 11: weekdays 15–19 h only (2026), closed weekends and holidays, free licence and vest from the office at Passeig Marítim 159. Outside those hours kiting is banned in summer. Free the rest of the year.", "bans": [{"from": "06-01", "to": "09-30", "startHour": 0, "endHour": 15}, {"from": "06-01", "to": "09-30", "startHour": 19, "endHour": 24}], "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-vilanova-i-la-geltru-la-farola", "name": "Vilanova i la Geltrú (La Farola)", "latitude": 41.21629, "longitude": 1.73998, "seaFacingDeg": 135.2, "distanceToShoreM": 8.5, "notes": "Town beach by the lighthouse; garbí and levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-segur-de-calafell", "name": "Segur de Calafell", "latitude": 41.18968, "longitude": 1.61244, "seaFacingDeg": 159.7, "distanceToShoreM": 23.7, "notes": "Wide sandy beach; garbí (SW) summer thermal and levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-calafell", "name": "Calafell", "latitude": 41.18688, "longitude": 1.57405, "seaFacingDeg": 171.0, "distanceToShoreM": 8.8, "notes": "Town beach next to Segur de Calafell; garbí and levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-creixell", "name": "Creixell", "latitude": 41.16064, "longitude": 1.45317, "seaFacingDeg": 150.0, "distanceToShoreM": 72.9, "notes": "Beach west of Torredembarra; garbí and levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-torredembarra", "name": "Torredembarra", "latitude": 41.1433, "longitude": 1.41236, "seaFacingDeg": 150.4, "distanceToShoreM": 45.2, "notes": "Off-season spot: kiting banned 1 Jun–30 Sep. Keep off the protected Muntanyans dunes east of town.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-altafulla", "name": "Altafulla", "latitude": 41.13301, "longitude": 1.37674, "seaFacingDeg": 164.0, "distanceToShoreM": 51.2, "notes": "Beach east of Tarragona; garbí and levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-la-pineda", "name": "La Pineda", "latitude": 41.08905, "longitude": 1.19327, "seaFacingDeg": 135.8, "distanceToShoreM": 21.7, "notes": "Kiting banned 1 Jun–30 Sep (Catalan coast rule). Shoreline bends here (136° locally vs 183° over ±1.5 km).", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-salou-platja-de-llevant", "name": "Salou (Platja de Llevant)", "latitude": 41.07246, "longitude": 1.13871, "seaFacingDeg": 191.8, "distanceToShoreM": 61.6, "notes": "Town beach; levante and garbí.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-cambrils-platja-del-regueral", "name": "Cambrils (Platja del Regueral)", "latitude": 41.06567, "longitude": 1.06949, "seaFacingDeg": 169.5, "distanceToShoreM": 21.6, "notes": "Shallow sandy bay west of the port; garbí and levante; mestral offshore.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-l-hospitalet-de-l-infant", "name": "L'Hospitalet de l'Infant", "latitude": 40.98322, "longitude": 0.91395, "seaFacingDeg": 135.6, "distanceToShoreM": 256.1, "notes": "Long beach south of the village; garbí and levante. The council has opened a marked kite zone on Platja de l'Arenal (before Camping Cala d'Oques); if it runs this summer, kiting is allowed there.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-l-almadrava-vandellos", "name": "L'Almadrava (Vandellòs)", "latitude": 40.93946, "longitude": 0.85825, "seaFacingDeg": 102.8, "distanceToShoreM": 12.1, "notes": "Quiet beach south of L'Hospitalet; garbí and levante.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-l-ampolla-platja-de-l-arenal", "name": "L'Ampolla (Platja de l'Arenal)", "latitude": 40.79345, "longitude": 0.70454, "seaFacingDeg": 63.7, "distanceToShoreM": 71.7, "notes": "Shallow beach facing the Badia del Fangar; good for learning.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": null, "waterType": "sea"}, {"id": "es-punta-del-fangar-ebro-delta", "name": "Punta del Fangar (Ebro delta)", "latitude": 40.79289, "longitude": 0.76252, "seaFacingDeg": 14.1, "distanceToShoreM": 30.0, "notes": "Remote sandspit at the north of the delta; access on foot; flat water in the bay.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": "pro", "sides": [{"name": "sea side", "seaFacingDeg": 14.1}, {"name": "Fangar bay", "seaFacingDeg": 201.6}], "waterType": "sea"}, {"id": "es-riumar-ebro-delta", "name": "Riumar (Ebro delta)", "latitude": 40.73131, "longitude": 0.83455, "seaFacingDeg": 19.6, "distanceToShoreM": 24.4, "notes": "Mainly an autumn–spring spot: best in mestral (NW, cross-shore); summer southerlies are offshore. Schools ride a signposted zone; one guide says the beach is closed to kites in summer. Check the signs on site.", "bans": null, "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-platja-dels-eucaliptus-ebro-delta", "name": "Platja dels Eucaliptus (Ebro delta)", "latitude": 40.65165, "longitude": 0.78052, "seaFacingDeg": 151.3, "distanceToShoreM": 90.8, "notes": "Shallow water at the root of the Trabucador, where the schools teach; beginner-friendly. In summer ride only the signposted kite zone.", "bans": null, "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-sant-carles-de-la-rapita-badia-dels-alfacs", "name": "Sant Carles de la Ràpita (Badia dels Alfacs)", "latitude": 40.61357, "longitude": 0.59301, "seaFacingDeg": 176.1, "distanceToShoreM": 13.7, "notes": "Flat water in the Badia dels Alfacs off the town beaches; mestral (NW) is offshore here.", "bans": [{"from": "06-01", "to": "09-30"}], "tier": null, "sides": null, "waterType": "sea"}, {"id": "es-el-trabucador-ebro-delta", "name": "El Trabucador (Ebro delta)", "latitude": 40.60919, "longitude": 0.7233, "seaFacingDeg": 305.5, "distanceToShoreM": 78.4, "notes": "Summer thermal (S) spot; flat, shallow water on the Badia dels Alfacs (west) side, about 1 m deep in places. Schools report signposted kite zones in summer.", "bans": null, "tier": null, "sides": [{"name": "bay side", "seaFacingDeg": 305.5}, {"name": "sea side", "seaFacingDeg": 125.6}], "waterType": "sea"}];
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const map=L.map('map',{layers:[sat]});L.control.layers({'Satellite':sat,'Map':osm}).addTo(map);
const ban=b=>!b?'none':b.map(x=>x.from+'→'+x.to+(x.startHour!=null?' '+x.startHour+'h–'+x.endHour+'h':'')).join(', ');
const pts=[];
S.forEach(x=>{const pro=x.tier==='pro',c=pro?'#8a5cf6':'#0a7d43';const ll=[x.latitude,x.longitude];pts.push(ll);
 const r=x.seaFacingDeg*Math.PI/180,d=0.004,end=[x.latitude+d*Math.cos(r),x.longitude+d*Math.sin(r)/Math.cos(x.latitude*Math.PI/180)];
 L.polyline([ll,end],{color:c,weight:3}).addTo(map);
 const sides=x.sides?'<br><b>Sides:</b> '+x.sides.map(s=>s.name+' '+Math.round(s.seaFacingDeg)+'°').join(', '):'';
 const p=`<div class=pop><b>${x.name}</b> <span class=${pro?'pro':'free'}>${pro?'Pro':'Free'}</span><br>${x.notes}<br><br><b>Faces:</b> ${Math.round(x.seaFacingDeg)}° · <b>Pin to water:</b> ${Math.round(x.distanceToShoreM)} m<br><b>Banned:</b> ${ban(x.bans)}${sides}<br><br><a target=_blank href="https://maps.apple.com/?ll=${ll}&t=k&z=17">Apple Maps</a><a target=_blank href="https://www.google.com/maps/@${ll},500m/data=!3m1!1e3">Google satellite</a><br><span class=m>${x.id}</span></div>`;
 const m=L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).bindPopup(p).addTo(map);
 const it=document.createElement('div');it.className='it';it.innerHTML=`<div class=n>${x.name}</div><div class=m><span class=${pro?'pro':'free'}>${pro?'Pro':'Free'}</span> · ${x.bans?'summer rules':'no ban'} · faces ${Math.round(x.seaFacingDeg)}°</div>`;
 it.onclick=()=>{map.setView(ll,16);m.openPopup()};document.getElementById('list').appendChild(it);});
map.fitBounds(pts,{padding:[30,30]});
</script></body></html>
