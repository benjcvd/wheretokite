# Rebuilds Data/spots.json when the catalogue sources change on main (e.g. a merged triage PR),
# so PRs only edit the CSVs and never conflict on the generated file. The server serves the new
# catalogue within an hour and the apps download it on their next launch.

name: Catalogue build

on:
  push:
    branches: [main]
    paths: [tools/spots/**, tools/build_spots.py, tools/check_directions.swift]
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if spots, banned spots or a country disappear (a deliberate removal)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog-build
  cancel-in-progress: true   # a newer push rebuilds everything; the older run would fail at push

jobs:
  build:
    runs-on: macos-latest   # Apple Maps direction check
    timeout-minutes: 120    # a cold OSM cache takes a while (Nominatim is 1 request/s)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: tools/.osm_cache
          key: osm-${{ github.run_id }}
          restore-keys: osm-
      - name: Seed the map cache
        run: |
          # A cold cache means hundreds of OSM queries, which public servers refuse to GitHub
          # runners. The osm-cache release holds a snapshot (refresh: see server/README.md).
          if [ ! -d tools/.osm_cache ] || [ -z "$(ls -A tools/.osm_cache)" ]; then
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/osm-cache/osm-cache.tar.gz \
              | tar -xz -C tools && echo "seeded: $(ls tools/.osm_cache | wc -l) entries" || echo "no seed available"
          fi
      - name: Build
        run: |
          cp Data/spots.json "$RUNNER_TEMP/previous.json"
          python3 tools/build_spots.py 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if grep -q "apple check unavailable" build.log; then
            echo "::error::Apple Maps check unavailable; not publishing a catalogue with unchecked directions"; exit 1
          fi
          # Same rule as the app's download check (KiteCore CatalogGate): no drop over 10% of the
          # spots, no banned spot lost, no country gone. Phones would refuse such a list anyway.
          if ! swift run -q kite --check-catalog Data/spots.json --against "$RUNNER_TEMP/previous.json"; then
            if [ "${{ inputs.allow_drop }}" = "true" ]; then
              echo "::warning::Catalogue gate failed; publishing anyway (allow_drop). Phones on the current app release will refuse it and keep their bundled list until the next release."
            else
              echo "::error::Catalogue gate failed (see above); not publishing. Deliberate removal: run this workflow by hand with allow_drop."; exit 1
            fi
          fi
          if [ "$status" -ne 0 ]; then echo "::error::Build reported problems (see PROBLEMS above)"; exit 1; fi
      - name: Commit
        run: |
          git diff --quiet -- Data/spots.json tools/review.md && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add Data/spots.json tools/review.md
          git commit -qm "Rebuild the spot catalogue"
          # Other commits (docs, app) may have landed on main during the build.
          # --autostash: the build leaves other tracked files touched, which blocked the pull (18 Nov).
          git pull -q --rebase --autostash origin main
          git push
      # Save the map cache even when the build or the gate fails, so the next run starts warm
      # (a failed run used to throw away an hour of lookups).
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/.osm_cache
          key: osm-${{ github.run_id }}
