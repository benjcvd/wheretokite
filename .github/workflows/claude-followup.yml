# The owner asks Claude for changes on a triage PR (or anything else) by commenting "@claude …"
# on an issue or PR. Only the repo owner's comments trigger it.

name: Claude follow-up

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '@claude')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.osm_cache
          key: osm-${{ github.run_id }}
          restore-keys: osm-
      - name: Seed the map cache
        run: |
          # A cold cache means hundreds of OSM queries, which public servers refuse to GitHub
          # runners. The osm-cache release holds a snapshot (refresh: see server/README.md).
          if [ ! -d tools/.osm_cache ] || [ -z "$(ls -A tools/.osm_cache)" ]; then
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/osm-cache/osm-cache.tar.gz \
              | tar -xz -C tools && echo "seeded: $(ls tools/.osm_cache | wc -l) entries" || echo "no seed available"
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(python3 tools/build_spots.py:*),Bash(swift test:*),Bash(swift build:*),Bash(git:*)"
