# Runs every automated check on each push and pull request, so a broken main shows up at once
# instead of on the next release. Same checks as the preflight skill:
#   engine  -> swift test (KiteCore)
#   server  -> npm test + npm run typecheck (Cloudflare Worker)
#   app     -> iPhone app build + unit tests (WhereToKiteTests) in the simulator
# The UI tests (WhereToKiteUITests) call the live server and take minutes: they stay manual.
# Public repo: the macOS minutes are free.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # only the latest push of a branch matters

jobs:
  server:
    name: Server tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  engine:
    name: Engine tests (KiteCore)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - run: swift test

  app:
    name: iPhone app build and unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime
                    for d in ds if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")')
          if [ -z "$id" ]; then echo "::error::No iPhone simulator on this runner"; exit 1; fi
          echo "SIM_ID=$id" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$id"
      - name: Build and run the unit tests
        # No signing on CI: the simulator doesn't need it and the runner has no certificate.
        run: |
          xcodebuild test -quiet \
            -project App/WhereToKite.xcodeproj -scheme WhereToKite \
            -destination "id=$SIM_ID" \
            -only-testing:WhereToKiteTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
